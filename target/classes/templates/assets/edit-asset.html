<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">

<head>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Modify Asset Profile — iNVision</title>
</head>

<body>
<section>

    <input type="hidden" id="targetAssetId" th:value="${assetId}"/>

    <div class="page-header">
        <div>
            <h2 class="page-heading">Modify Asset Profile</h2>
            <p class="page-subtitle">Update system records, lifecycle metrics, or operational hub allocation zones.</p>
        </div>
        <a th:href="@{/assets}" class="btn btn-secondary">Cancel & Return</a>
    </div>

    <div class="form-card" style="max-width: 800px; margin: 0 auto;">
        <form id="updateAssetForm">

            <div class="form-group">
                <label class="form-label" for="title">Asset Title / Name</label>
                <input class="form-control" type="text" id="title" required />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="serialNumber">Serial Number</label>
                    <input class="form-control" type="text" id="serialNumber" required />
                </div>
                <div class="form-group">
                    <label class="form-label" for="category">Category</label>
                    <select class="form-control" id="category" required>
                        <option value="">Select category</option>
                        <option value="LAPTOP">Electronics / Laptops</option>
                        <option value="AUDIO">Audio Hardware</option>
                        <option value="CAMERA">Office Furniture & Gear</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="condition">Current Condition</label>
                    <select class="form-control" id="condition" required>
                        <option value="">Select condition</option>
                        <option value="BRAND_NEW">Brand New / Factory Boxed</option>
                        <option value="GOOD">Good / Lightly Used</option>
                        <option value="FAIR">Fair / Functional</option>
                        <option value="DAMAGED">Damaged / Requires Repair</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="location">Storage / Allocation Hub</label>
                    <select class="form-control" id="location" required>
                        <option value="">Select storage location</option>
                        <option value="AdminOffice">Admin Office</option>
                        <option value="SecureVault">Secure Vault</option>
                        <option value="DockingStation">Docking Station</option>
                        <option value="BatterySafetyCabinet">Battery Safety Cabinet</option>
                        <option value="ConsoleLockers">Console Lockers</option>
                        <option value="PaddedTrunkSection">Padded Trunk Section</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="cost">Acquisition Cost (ZAR)</label>
                <input class="form-control" type="number" step="0.01" id="cost" required />
            </div>

            <div class="form-group">
                <label class="form-label" for="path">Asset Image URL</label>
                <input class="form-control" type="url" id="path" />
            </div>

            <div class="form-actions" style="margin-top: 24px; padding-top: 16px;">
                <button type="submit" class="btn btn-primary">Commit Changes</button>
                <a th:href="@{/assets}" class="btn btn-secondary">Discard Modifications</a>
            </div>
        </form>
    </div>

</section>
</body>
</html>
