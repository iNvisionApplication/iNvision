<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title th:text="${pageTitle} ?: 'Error'">Error</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background:  #0d1b3e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .error-card {
      background: white;
      width: 500px;
      max-width: 90%;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,.1);
      text-align: center;
    }

    .status-code {
      font-size: 64px;
      font-weight: bold;
      color: #d32f2f;
      margin-bottom: 10px;
    }

    .heading {
      font-size: 30px;
      margin-bottom: 20px;
      color: #333;
    }

    .message {
      color: #666;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .action-btn {
      display: inline-block;
      padding: 12px 28px;
      background: #1976d2;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      transition: .2s;
    }

    .action-btn:hover {
      background:  #0d1b3e;
    }
  </style>
</head>
<body>

<div class="error-card">

  <div id="statusCode"
       class="status-code"
       th:text="${statusCode} ?: 'Error'">
    404
  </div>

  <h1 id="errorHeading"
      class="heading"
      th:text="${heading} ?: 'Something went wrong'">
    Something went wrong
  </h1>

  <p id="errorMessage"
     class="message"
     th:text="${message} ?: 'An unexpected error has occurred.'">
    An unexpected error has occurred.
  </p>

  <a id="actionButton"
     class="action-btn"
     th:href="@{/dashboard}">
    Go back to dashboard
  </a>

</div>
</body>
</html>
