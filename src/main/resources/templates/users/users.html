<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Users</title>
</head>
<body>
<section>
    <div class="page-header">

        <div class="page-heading">
            Users
            <span>Manage system users</span>
        </div>

        <button type="button"
                class="btn-edit-user"
                onclick="openAddAdminModal()">
            + Add New Admin
        </button>

    </div>

    <div class="table-card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody id="usersTableBody">
            <tr>
                <td colspan="6">Loading users...</td>
            </tr>
            </tbody>
        </table>
    </div>
    <div id="editUserModal" class="modal-overlay hidden">
        <div class="modal-card">

            <div class="modal-header">
                <h3>Edit User</h3>
                <button type="button"
                        class="modal-close"
                        onclick="closeEditUserModal()">
                    ×
                </button>
            </div>

            <form id="editUserForm">

                <input type="hidden" id="editUserId">

                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="editName" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="editEmail" required>
                </div>

                <div class="form-group">
                    <label>Department</label>
                    <select id="editDepartment" required>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="FINANCE">FINANCE</option>
                        <option value="OPERATIONS">OPERATIONS</option>
                        <option value="MARKETING">MARKETING</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Role</label>
                    <select id="editRole" required>
                        <option value="ADMIN">ADMIN</option>
                        <option value="MANAGER">MANAGER</option>
                        <option value="BORROWER">BORROWER</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button"
                            class="btn-cancel"
                            onclick="closeEditUserModal()">
                        Cancel
                    </button>

                    <button type="submit"
                            class="btn-save-user">
                        Save Changes
                    </button>
                </div>

            </form>

        </div>
    </div>
    <div id="addAdminModal" class="modal-overlay hidden">
        <div class="modal-card">

            <div class="modal-header">
                <h3>Add New Admin</h3>
                <button type="button" class="modal-close" onclick="closeAddAdminModal()">×</button>
            </div>

            <form id="addAdminForm">

                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="adminName" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="adminEmail" required>
                </div>

                <div class="form-group">
                    <label>Department</label>
                    <select id="adminDepartment" required>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="FINANCE">FINANCE</option>
                        <option value="OPERATIONS">OPERATIONS</option>
                        <option value="MARKETING">MARKETING</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Temporary Password</label>
                    <input type="password" id="adminPassword" required>
                </div>

                <input type="hidden" id="adminRole" value="ADMIN">

                <div class="form-note">
                    The new admin must reset this password on first login.
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeAddAdminModal()">Cancel</button>
                    <button type="submit" class="btn-save-user">Create Admin</button>
                </div>

            </form>
        </div>
    </div>
</section>
</body>
</html>
