<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Set New Password — iNVision Asset Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght=400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <link rel="stylesheet" th:href="@{/css/auth.css}"/>
</head>
<body>
<div class="auth-page">
    <div class="auth-box">

        <div class="auth-logo">
            <svg width="44" height="44" viewBox="0 0 38 38" fill="none">
                <rect x="9" y="14" width="5" height="18" fill="#16285a"/>
                <circle cx="11.5" cy="9" r="3.5" fill="#16285a"/>
                <polygon points="16,14 21,14 30,28 30,32 25,32 16,18" fill="#6b89b8" opacity="0.8"/>
                <polygon points="16,14 21,14 21,32 16,32" fill="#16285a"/>
                <polygon points="25,14 30,14 30,32 25,32" fill="#6b89b8"/>
            </svg>
            <div class="auth-logo-text">
                <div class="logo-name">i<span>N</span>Vision</div>
                <span class="logo-sub">Asset Management</span>
            </div>
        </div>

        <h1 class="auth-title">Update Password</h1>
        <p class="auth-subtitle">Please create a strong new password to protect your user account privileges.</p>

        <div th:if="${error}" class="alert alert-error" style="margin: 0 0 20px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span th:text="${error}">The recovery session token is invalid or has expired.</span>
        </div>

        <div id="validationAlert" class="alert alert-error" style="display: none; margin: 0 0 20px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="validationMessage">Passwords do not match.</span>
        </div>

        <form th:action="@{/forgot-password/reset}" method="post" id="resetForm">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <input type="hidden" name="token" th:value="${token}"/>

            <div class="form-group">
                <label class="form-label" for="password">New Password</label>

                <div class="password-field">
                    <input class="form-control"
                           type="password"
                           id="password"
                           name="password"
                           placeholder="••••••••"
                           minlength="8"
                           autocomplete="new-password"
                           required/>

                    <span class="password-toggle"
                          onclick="togglePassword('password', this)">
                          <i data-lucide="eye"></i>
                    </span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm New Password</label>

                <div class="password-field">
                    <input class="form-control"
                           type="password"
                           id="confirmPassword"
                           name="confirmPassword"
                           placeholder="••••••••"
                           minlength="8"
                           autocomplete="new-password"
                           required/>

                    <span class="password-toggle"
                          onclick="togglePassword('confirmPassword', this)">
                          <i data-lucide="eye"></i>
                    </span>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary btn-full" style="margin-top:12px;">
                <span id="btnIcon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </span>
                <span id="btnText">Save & Update Password</span>
            </button>
        </form>

        <p style="text-align:center;margin-top:32px;font-size:10px;color:var(--text-muted);letter-spacing:0.06em;">
            LOANING ASSETS. EMPOWERING POSSIBILITIES.
        </p>
    </div>
</div>

<script>
    const form = document.getElementById("resetForm");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const validationAlert = document.getElementById("validationAlert");
    const validationMessage = document.getElementById("validationMessage");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");

    form.addEventListener("submit", function (event) {
        // Enforce matching fields check
        if (password.value !== confirmPassword.value) {
            event.preventDefault();
            validationMessage.textContent = "Confirmation password does not match original entry.";
            validationAlert.style.display = "flex";
            return false;
        }

        validationAlert.style.display = "none";
        submitBtn.classList.add("loading");
        submitBtn.disabled = true;
        btnText.textContent = "Updating Credentials...";
    });
</script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
    function togglePassword(inputId, toggle) {
        const input = document.getElementById(inputId);

        if (input.type === "password") {
            input.type = "text";
            toggle.innerHTML = '<i data-lucide="eye-off"></i>';
        } else {
            input.type = "password";
            toggle.innerHTML = '<i data-lucide="eye"></i>';
        }

        lucide.createIcons();
    }

    lucide.createIcons();
</script>
</body>
</html>
