<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Sign In — iNVision Asset Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <link rel="stylesheet" th:href="@{/css/auth.css}"/>

    <style>
        /* 1. Full-screen background matching the splash screen in Screenshot (51).jpg */
        body, .auth-page {
            background: radial-gradient(circle at center, #102243 0%, #071122 100%) !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        /* 2. Crisp, light-mode card to make the form pop cleanly */
        .auth-box {
            background: #ffffff !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #1a202c !important;
            padding: 40px !important;
            border-radius: 16px !important;
            width: 100%;
            max-width: 450px;
        }

        /* 3. Golden Splash-inspired Icon inside the white card */
        .premium-logo-box {
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, #f3e1b6 0%, #cfb37c 50%, #aa8f56 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            box-shadow: 0 4px 12px rgba(207, 179, 124, 0.3);
        }

        .premium-logo-box span {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
            font-size: 24px;
            color: #16285a; /* Changed from black/dark navy to true sapphire navy */
            letter-spacing: -1px;
        }

        /* Text styling - Welcome message forced to visible Sapphire Navy */
        .auth-title {
            color: #16285a !important;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
        }

        .auth-subtitle {
            color: #718096 !important;
        }

        /* Inputs & Form Elements - Highly visible dark text on white background */
        .form-label {
            color: #4a5568 !important;
            font-size: 11px;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .form-control {
            background: #ffffff !important;
            border: 1px solid #cbd5e0 !important;
            color: #1a202c !important;
        }

        .form-control:focus {
            border-color: #cfb37c !important;
            box-shadow: 0 0 0 2px rgba(207, 179, 124, 0.2) !important;
        }

        /* Distinctive Sapphire Navy Button configuration */
        .btn-premium-navy {
            background: #16285a !important; /* Rich sapphire navy that visibly shows its color profile */
            color: #ffffff !important;
            font-weight: 500;
            border: 1px solid #16285a !important;
            transition: all 0.2s ease;
        }

        .btn-premium-navy:hover {
            background: #233c77 !important; /* Slightly lighter and more saturated navy on hover */
            border-color: #233c77 !important;
        }

        /* Branding link accents */
        .auth-link a, .auth-link {
            color: #4a5568 !important;
        }

        .auth-link a {
            color: #aa8f56 !important;
            font-weight: 500;
            text-decoration: none;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        .brand-rule {
            color: #a0aec0 !important;
        }
    </style>
</head>
<body>
<div class="auth-page">
    <div class="auth-box">

        <!-- Logo matching Splash Screen Icon -->
        <div class="auth-logo" style="flex-direction: column; text-align: center; display: flex; justify-content: center;">
            <div class="premium-logo-box">
                <span>iN</span>
            </div>
            <div class="auth-logo-text" style="margin-left: 0;">
                <div class="logo-name" style="color: #16285a; font-size: 26px;">i<span style="color: #cfb37c;">N</span>Vision</div>
                <span class="logo-sub" style="color: #718096; letter-spacing: 0.15em;">ASSET MANAGEMENT SYSTEM</span>
            </div>
        </div>

        <h1 class="auth-title" style="margin-top: 24px; text-align: center;">Welcome back</h1>
        <p class="auth-subtitle" style="text-align: center; margin-bottom: 24px;">Sign in to access the asset management system</p>

        <!-- Alerts styled for light mode containers -->
        <div th:if="${param.error}" class="alert alert-error" style="margin: 0 0 20px; background: #fff5f5; border: 1px solid #feb2b2; color: #c53030;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; margin-right: 8px;">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span>Invalid email or password.</span>
        </div>

        <div th:if="${param.logout}" class="alert alert-success" style="margin: 0 0 20px; background: #f0fff4; border: 1px solid #9ae6b4; color: #22543d;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; margin-right: 8px;">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
            <span>You have been signed out successfully.</span>
        </div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group" style="margin-bottom: 16px;">
                <label class="form-label" for="username">Email Address</label>
                <input class="form-control" type="email" id="username" name="username"
                       placeholder="you@company.com" autocomplete="email" required/>
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label class="form-label" for="password">Password</label>
                <div class="password-field" style="position: relative;">
                    <input class="form-control"
                           type="password"
                           id="password"
                           name="password"
                           placeholder="••••••••"
                           autocomplete="current-password"
                           required/>
                    <span class="password-toggle" onclick="togglePassword('password', this)" style="color: #a0aec0;">
                          <i data-lucide="eye"></i>
                    </span>
                </div>
            </div>

            <!-- Solid True Sapphire Navy Button -->
            <button type="submit" id="loginBtn" class="btn btn-premium-navy btn-full" style="margin-top:8px; width: 100%;">
                <span id="loginIcon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px; height:16px; vertical-align: middle; margin-right:6px;">
                         <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                         <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                </span>
                <span id="loginBtnText">Sign In</span>
                <span id="loginSpinner" class="login-spinner"></span>
            </button>
        </form>

        <div class="brand-rule" style="text-align: center; margin: 20px 0;">or</div>

        <p class="auth-link" style="text-align: center; margin-bottom: 8px;">
            Don't have an account? <a th:href="@{/register}">Register here</a>
        </p>
        <p class="auth-link" style="text-align: center; margin-bottom: 0;">
            <a th:href="@{/forgot-password}">Forgot your password?</a>
        </p>

        <p style="text-align:center; margin-top:32px; font-size:10px; color:#a0aec0; letter-spacing:0.06em;">
            LOANING ASSETS. EMPOWERING POSSIBILITIES.
        </p>
    </div>
</div>

<script>
    const loginForm = document.querySelector("form");
    const loginBtn = document.getElementById("loginBtn");
    const loginBtnText = document.getElementById("loginBtnText");

    loginForm.addEventListener("submit", function () {
        loginBtn.classList.add("loading");
        loginBtn.disabled = true;
        loginBtnText.textContent = "Signing In...";
    });
</script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
    function togglePassword(inputId, toggle) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            toggle.innerHTML = '<i data-lucide="eye-off"></i>';
        } else {
            input.type = "password";
            toggle.innerHTML = '<i data-lucide="eye"></i>';
        }
        lucide.createIcons();
    }
    lucide.createIcons();
</script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
