<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">

<head>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>My Loans</title>
</head>

<body>
<section>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <input type="hidden" id="currentUserId" th:value="${#authentication.principal.id}"/>
    <input type="hidden" id="currentUserRole" th:value="${#authentication.principal.authorities[0].authority.replace('ROLE_', '')}"/>
    <input type="hidden" id="statusFilter" th:value="${statusFilter}">

    <div class="page-header">
        <div>
            <h2 class="page-heading">My Loans</h2>
            <p class="page-subtitle">View your loan history and current loan requests.</p>
        </div>

        <a th:href="@{/assets}" class="btn btn-primary">
            Request Loan
        </a>
    </div>

    <div class="table-wrapper">
        <table class="data-table">
            <thead>
            <tr>
                <th>Loan ID</th>
                <th>Asset</th>
                <th>Full name</th>
                <th>Description</th>
                <th>Request Date</th>
                <th>Due Date</th>
                <th>Status</th>
                <th>Actions</th> </tr>
            </thead>

            <tbody id="loanHistoryBody">
            <tr>
                <td colspan="7">Loading loans...</td>
            </tr>
            </tbody>
        </table>
    </div>

</section>
</body>
</html>
