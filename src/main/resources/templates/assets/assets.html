<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">

<head>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Available Assets</title>
</head>

<body>
<section>

    <input type="hidden" id="currentUserId" th:value="${currentUserId}"/>
    <input type="hidden" id="currentUserRole" th:value="${currentUserRole}"/>

    <div class="page-header">
        <div>
            <h2 class="page-heading">Available Assets</h2>
            <p class="page-subtitle">Choose an asset and submit a loan request.</p>
        </div>

        <div style="display: flex; gap: 10px; align-items: center;">
            <div th:if="${currentUserRole == 'ADMIN' or currentUserRole == 'MANAGER'}">
                <a th:href="@{/assets/add}" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Add New Asset
                </a>
            </div>

            <a th:href="@{/loans}" class="btn btn-secondary">
                Back to My Loans
            </a>
        </div>
    </div>

    <div class="asset-loan-layout">

        <div>
            <div class="asset-toolbar">
                <h3>Available for Loan</h3>
                <span id="assetCount">Loading...</span>
            </div>

            <div class="asset-search-wrapper" style="display: flex; gap: 10px;">
                <i data-lucide="search" class="asset-search-icon"></i>

                <input type="text"
                       id="assetSearchInput"
                       class="form-control asset-search"
                       placeholder="Search assets..."
                       onkeyup="searchAllAssets()">

                <select id="assetCategoryFilter" class="form-control" onchange="filterAssetsByCategory()" style="max-width: 200px;">
                    <option value="ALL">All Categories</option>
                    <option th:each="cat : ${T(com.invision.web.Invision.enums.Category).values()}"
                            th:value="${cat}"
                            th:text="${cat}"></option>
                </select>
            </div>

            <div class="asset-grid" id="availableAssetsContainer">
                <p>Loading available assets...</p>
            </div>
        </div>

        <aside class="loan-request-panel" id="loanRequestPanel">

            <h3>Loan Request</h3>

            <div class="selected-asset-box">
                <span>Selected Asset</span>
                <strong id="selectedAssetTitle">No asset selected</strong>
            </div>

            <form id="loanRequestForm">

                <input type="hidden" id="selectedAssetId"/>

                <label for="collectionDate">Collection Date</label>
                <input type="date" id="collectionDate" required>

                <label for="returnDate">Return Date</label>
                <input type="date" id="returnDate" required>

                <label for="description">Purpose :</label>
                <textarea id="description"
                          rows="5"
                          placeholder="Explain why you need this asset?"
                          required></textarea>

                <button type="submit" class="btn btn-primary" id="submitLoanBtn" disabled>
                    Select an Asset First
                </button>

            </form>

        </aside>

    </div>

    <div id="errorModalBackdrop" class="modal-backdrop">
        <div class="modal">
            <h3 class="modal-title" id="errorModalTitle">Request Restricted</h3>
            <div class="modal-body" id="errorModalBody">
            </div>
            <div class="modal-actions">
                <button type="button" id="closeErrorModalBtn" class="btn btn-primary">Acknowledge</button>
            </div>
        </div>
    </div>

</section>
</body>
</html>
